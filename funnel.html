const POSITIVE_LABELS = new Set([
  "booked", "held", "re-engaged", "offer sent", "payment received",
  "onboarding done", "sprint complete", "signed", "resolved", "auto", "manual"
]);
const NEGATIVE_LABELS = new Set([
  "no response", "no-show", "not a fit", "ghosted", "no purchase",
  "2\u00d7 no response", "lost", "client left", "objections"
]);

function edgeColor(label) {
  if (POSITIVE_LABELS.has(label)) return "#22c55e";
  if (NEGATIVE_LABELS.has(label)) return "#ef4444";
  return "#94a3b8";
}
function edgeWidth(label) {
  if (POSITIVE_LABELS.has(label)) return 2.5;
  if (NEGATIVE_LABELS.has(label)) return 1.5;
  return 1.5;
}

function getSubtitle(stage, view) {
  switch (view) {
    case "Lead Journey": return stage.goal || "";
    case "HubSpot Setup": return stage.hubspot || "";
    case "Email Sequences":

    case "Full Detail": return stage.trigger || "";
    default: return "";
  }
}

// =============================================================================
// LAYOUT ENGINE
// =============================================================================

const STAGE_W = 280, STAGE_H = 88, ENTRY_W = 140, ENTRY_H = 52;

function computeLayout(visibleStages, visibleEntries, visibleEdges) {
  const g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: "LR", nodesep: 70, ranksep: 120, marginx: 40, marginy: 40 });
  g.setDefaultEdgeLabel(() => ({}));

  visibleEntries.forEach(e => g.setNode(e.id, { width: ENTRY_W, height: ENTRY_H }));
  visibleStages.forEach(s => g.setNode(s.id, { width: STAGE_W, height: STAGE_H }));
  visibleEdges.forEach(e => g.setEdge(e.source, e.target));

  dagre.layout(g);

  const positions = {};
  g.nodes().forEach(id => {
    const n = g.node(id);
    if (n) positions[id] = { x: n.x - n.width / 2, y: n.y - n.height / 2 };
  });
  return positions;
}

// =============================================================================
// CUSTOM EDGE
// =============================================================================

const FunnelEdge = memo(function FunnelEdge(props) {
  const { sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition,
    data, markerEnd, style: edgeStyle } = props;
  const isLoop = data && data.loop;
  const label = data && data.label || "";
  const color = edgeColor(label);

  let path, labelX, labelY;
  if (isLoop) {
    const result = getSmoothStepPath({
      sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition, borderRadius: 20,
    });
    path = result[0]; labelX = result[1]; labelY = result[2];
  } else {
    const result = getBezierPath({
      sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition,
    });
    path = result[0]; labelX = result[1]; labelY = result[2];
  }

  return html`
    <g>
      <${BaseEdge} path=${path} markerEnd=${markerEnd}
        style=${{ ...edgeStyle, stroke: color, strokeWidth: edgeWidth(label),
          strokeDasharray: isLoop ? "6 3" : undefined }} />
      ${label && html`
        <foreignObject x=${labelX - 50} y=${labelY - 12} width=${100} height=${24}
          style=${{ overflow: "visible", pointerEvents: "none" }}>
          <div style=${{
            fontSize: 13, fontWeight: 600, color: color, textAlign: "center",
            background: "rgba(248,250,252,0.9)", borderRadius: 4, padding: "1px 4px",
            whiteSpace: "nowrap", display: "inline-block", width: "100%",
          }}>
            ${label}
          </div>
        </foreignObject>
      `}
    </g>
  `;
});

  const showEmails = activeView === "Email Sequences" || activeView === "Full Detail";

  return html`
    <div style=${{
      position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 900,
      background: "#fff", boxShadow: "0 -2px 12px rgba(0,0,0,0.08)",
      transition: "max-height 0.3s ease",
      maxHeight: expanded ? "40vh" : 48,
      overflow: "hidden", display: "flex", flexDirection: "column",
    }}>
      <div onClick=${() => setExpanded(e => !e)} style=${{
        height: 48, minHeight: 48, display: "flex", alignItems: "center", justifyContent: "center",
        cursor: "pointer", gap: 8, borderBottom: expanded ? "1px solid #e2e8f0" : "none",
      }}>
        <span style=${{ fontSize: 16, fontWeight: 600, color: "#475569" }}>
          ${expanded ? "\u25bc" : "\u25b2"} Stage Table
        </span>
      </div>
      ${expanded && html`
        <div style=${{ overflowY: "auto", flex: 1 }}>
          <table style=${{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
            <thead>
              <tr style=${{ position: "sticky", top: 0, background: "#f1f5f9", zIndex: 1 }}>
                <th style=${{ ...thStyle }}>Code</th>
                <th style=${{ ...thStyle }}>Label</th>
                <th style=${{ ...thStyle }}>Group</th>
                <th style=${{ ...thStyle }}>Trigger</th>
                <th style=${{ ...thStyle }}>Goal</th>
                ${showHubspot && html`<th style=${{ ...thStyle }}>HubSpot</th>`}
                ${showEmails && html`<th style=${{ ...thStyle }}>Sequence</th>`}
                ${showEmails && html`<th style=${{ ...thStyle }}>Emails</th>`}
              </tr>
            </thead>
            <tbody>
              ${stages.map(s => html`
                <tr key=${s.id} style=${{ borderBottom: "1px solid #f1f5f9" }}>
                  <td style=${{ ...tdStyle, fontWeight: 600 }}>${s.code}</td>
                  <td style=${{ ...tdStyle }}>${s.label}</td>
                  <td style=${{ ...tdStyle }}>
                    <span style=${{
                      display: "inline-block", padding: "2px 8px", borderRadius: 10,
                      fontSize: 13, fontWeight: 600, color: "#fff",
                      background: GROUP_COLORS[s.group] || "#64748b",
                    }}>${s.group}</span>
                  </td>
                  <td style=${{ ...tdStyle }}>${s.trigger || "\u2014"}</td>
                  <td style=${{ ...tdStyle }}>${s.goal || "\u2014"}</td>
                  ${showHubspot && html`<td style=${{ ...tdStyle, fontFamily: "monospace" }}>${s.hubspot || "\u2014"}</td>`}
                  ${showEmails && html`<td style=${{ ...tdStyle, fontFamily: "monospace" }}>${s.sequence || "\u2014"}</td>`}
                  ${showEmails && html`<td style=${{ ...tdStyle, textAlign: "center" }}>${s.emails || "\u2014"}</td>`}
                </tr>
              `)}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;
});

const thStyle = { padding: "10px 12px", textAlign: "left", fontWeight: 700, fontSize: 14, color: "#475569" };
const tdStyle = { padding: "8px 12px", fontWeight: 400, fontSize: 14, color: "#1e293b" };

// =============================================================================
// LEGEND
// =============================================================================

const Legend = memo(function Legend() {
  const [open, setOpen] = useState(false);

  if (!open) {
    return html`
      <button onClick=${() => setOpen(true)} style=${{
        position: "fixed", bottom: 60, left: 60, zIndex: 950, padding: "8px 14px",
        borderRadius: 10, border: "1px solid #e2e8f0", background: "#fff", cursor: "pointer",
        fontSize: 14, fontWeight: 400, color: "#475569", boxShadow: "0 2px 8px rgba(0,0,0,0.08)",
      }}>\u2753 Legend</button>
    `;
  }

  return html`
    <div style=${{
      position: "fixed", bottom: 60, left: 60, zIndex: 950, width: 300,
      background: "#fff", borderRadius: 14, border: "1px solid #e2e8f0",
      boxShadow: "0 4px 16px rgba(0,0,0,0.12)", padding: 16,
    }}>
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <span style=${{ fontSize: 16, fontWeight: 700, color: "#1e293b" }}>Legend</span>
        <button onClick=${() => setOpen(false)} style=${{
          background: "none", border: "none", cursor: "pointer", fontSize: 14, color: "#64748b",
        }}>\u2715 Close</button>
      </div>
      <div style=${{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 12px", marginBottom: 14 }}>
        ${Object.entries(TYPE_ICONS).filter(([k]) => k !== "entry").map(([type, icon]) => html`
          <div key=${type} style=${{ display: "flex", alignItems: "center", gap: 6, fontSize: 14, color: "#475569" }}>
            <span style=${{ fontSize: 18 }}>${icon}</span> ${type}
          </div>
        `)}
      </div>
      <div style=${{ borderTop: "1px solid #e2e8f0", paddingTop: 10, display: "flex", flexWrap: "wrap", gap: 6 }}>
        ${Object.entries(GROUP_COLORS).map(([group, color]) => html`
          <span key=${group} style=${{
            display: "inline-block", padding: "3px 10px", borderRadius: 10,
            fontSize: 13, fontWeight: 600, color: "#fff", background: color,
          }}>${GROUP_LABELS[group] || group}</span>
        `)}
      </div>
    </div>
  `;
});

// =============================================================================
// MAIN APP
// =============================================================================

function App() {
  const [activeView, setActiveView] = useState("Lead Journey");
  const [selectedStage, setSelectedStage] = useState(null);

  // Filter stages by view
  const visibleStages = useMemo(() => {
    if (activeView === "Email Sequences") {
      return STAGES.filter(s => s.sequence !== null);
    }
    return STAGES;
  }, [activeView]);

  const visibleEntries = useMemo(() => {
    if (activeView === "Email Sequences") return [];
    return ENTRY_NODES;
  }, [activeView]);

  // Filter edges to only those connecting visible nodes
  const visibleEdgeData = useMemo(() => {
    const ids = new Set([...visibleStages.map(s => s.id), ...visibleEntries.map(e => e.id)]);
    return EDGES.filter(e => ids.has(e.source) && ids.has(e.target));
  }, [visibleStages, visibleEntries]);

  // Compute layout
  const positions = useMemo(() => {
    return computeLayout(visibleStages, visibleEntries, visibleEdgeData);
  }, [visibleStages, visibleEntries, visibleEdgeData]);

  // Build ReactFlow nodes
  const flowNodes = useMemo(() => {
    const nodes = [];
    visibleEntries.forEach(e => {
      nodes.push({
        id: e.id, type: "entry",
        position: positions[e.id] || { x: 0, y: 0 },
        data: { entry: e },
        style: { width: ENTRY_W, height: ENTRY_H },
      });
    });
    visibleStages.forEach(s => {
      nodes.push({
        id: s.id, type: "stage",
        position: positions[s.id] || { x: 0, y: 0 },
        data: { stage: s, view: activeView },
        style: { width: STAGE_W, height: STAGE_H },
      });
    });
    return nodes;
  }, [visibleStages, visibleEntries, positions, activeView]);

  // Build ReactFlow edges
  const flowEdges = useMemo(() => {
    return visibleEdgeData.map((e, i) => {
      const color = edgeColor(e.label);
      return {
        id: e.source + "-" + e.target + "-" + i,
        source: e.source, target: e.target,
        type: "funnel",
        animated: !!e.loop,
        data: { label: e.label, loop: e.loop },
        markerEnd: { type: MarkerType.ArrowClosed, width: 14, height: 14, color: color },
      };
    });
  }, [visibleEdgeData]);

  const onNodeClick = useCallback((_, node) => {
    if (node.type === "entry") return;
    const stage = node.data.stage;
    setSelectedStage(prev => prev && prev.id === stage.id ? null : stage);
  }, []);

  const closeDetail = useCallback(() => setSelectedStage(null), []);

  const onViewChange = useCallback((v) => {
    setActiveView(v);
    setSelectedStage(null);
  }, []);

  const minimapColor = useCallback((node) => {
    if (node.data.entry) return node.data.entry.color;
    if (node.data.stage) return GROUP_COLORS[node.data.stage.group] || "#64748b";
    return "#64748b";
  }, []);

  // Remove loading screen on mount
  useEffect(() => {
    const t = setTimeout(() => {
      const el = document.getElementById("loading-overlay");
      if (el) { el.classList.add("fade-out"); setTimeout(() => el.remove(), 400); }
    }, 500);
    return () => clearTimeout(t);
  }, []);

  return html`
    <div style=${{ width: "100%", height: "100vh", background: "#f8fafc", position: "relative" }}>
      <${TopBar} activeView=${activeView} onViewChange=${onViewChange}
        stageCount=${visibleStages.length} edgeCount=${visibleEdgeData.length} />

      <div style=${{ width: "100%", height: "100%", paddingTop: 56 }}>
        <${ReactFlow}
          key=${activeView}
          nodes=${flowNodes}
          edges=${flowEdges}
          nodeTypes=${nodeTypes}
          edgeTypes=${edgeTypes}
          onNodeClick=${onNodeClick}
          fitView=${true}
          fitViewOptions=${{ padding: 0.15 }}
          minZoom=${0.3}
          maxZoom=${2.0}
          proOptions=${{ hideAttribution: true }}
        >
          <${Background} color="#e2e8f0" gap=${20} />
          <${MiniMap}
            nodeColor=${minimapColor}
            maskColor="rgba(0,0,0,0.08)"
            style=${{ top: 12, right: 12 }}
          />
          <${Controls} style=${{ bottom: 60, left: 12 }} />
        <//>
      </div>

      <${DetailCard} stage=${selectedStage} onClose=${closeDetail} />
      <${BottomTable} stages=${visibleStages} activeView=${activeView} />
      <${Legend} />
    </div>
  `;
}

// =============================================================================
// MOUNT
// =============================================================================

const root = createRoot(document.getElementById("root"));
root.render(html`<${App} />`);

  </script>
</body>
</html>
